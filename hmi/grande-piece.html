<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>CasFrontend [2.0.0] — Grande Pièce</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f0f0f0; }

    .topbar {
      background: #1a7bc4;
      color: white;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: bold;
    }

    .container {
      display: flex;
      height: calc(100vh - 36px - 24px);
    }

    .sidebar {
      width: 130px;
      background: #2ecc71;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 10px;
      border-right: 1px solid #ccc;
    }

    .sidebar .letter {
      font-size: 72px;
      font-weight: bold;
      color: white;
    }

    .sidebar .op-info {
      margin-top: 16px;
      text-align: center;
      color: white;
      font-size: 11px;
      line-height: 1.6;
    }

    .content {
      flex: 1;
      padding: 30px;
    }

    .breadcrumb {
      font-size: 12px;
      color: #888;
      margin-bottom: 16px;
    }

    .breadcrumb span { color: #1a7bc4; font-weight: bold; }

    h2 { font-size: 16px; color: #333; margin-bottom: 6px; }

    p.subtitle {
      font-size: 12px;
      color: #888;
      margin-bottom: 24px;
    }

    .scan-box {
      background: white;
      border: 2px dashed #1a7bc4;
      border-radius: 8px;
      padding: 30px;
      max-width: 420px;
      margin-bottom: 20px;
    }

    .scan-box label {
      font-size: 12px;
      color: #555;
      display: block;
      margin-bottom: 8px;
    }

    .scan-box input {
      width: 100%;
      height: 42px;
      font-size: 16px;
      padding: 6px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      text-align: center;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }

    .btn-primary {
      width: 100%;
      height: 44px;
      background: #1a7bc4;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 14px;
      border-radius: 4px;
    }

    .btn-primary:hover { background: #1565a8; }

    .gp-info {
      background: white;
      border-left: 4px solid #2ecc71;
      border-radius: 6px;
      padding: 20px;
      max-width: 420px;
      display: none;
      margin-bottom: 16px;
    }

    .gp-info h3 {
      color: #27ae60;
      margin-bottom: 12px;
      font-size: 14px;
    }

    .gp-info table {
      width: 100%;
      font-size: 13px;
      border-collapse: collapse;
    }

    .gp-info td {
      padding: 6px 8px;
      border-bottom: 1px solid #f0f0f0;
    }

    .gp-info td:first-child {
      color: #888;
      width: 160px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .btn-inspect {
      flex: 1;
      height: 44px;
      background: #27ae60;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 13px;
      border-radius: 4px;
    }

    .btn-fin {
      flex: 1;
      height: 44px;
      background: #e67e22;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 13px;
      border-radius: 4px;
    }

    .btn-lot {
      width: 100%;
      height: 40px;
      background: #7f8c8d;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 12px;
      border-radius: 4px;
      margin-top: 10px;
    }

    .message {
      padding: 10px 14px;
      border-radius: 4px;
      font-size: 13px;
      max-width: 420px;
      margin-top: 10px;
      display: none;
    }

    .message.error {
      background: #f8d7da;
      color: #721c24;
      display: block;
    }

    .status-bar {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: #ddd;
      font-size: 11px;
      padding: 4px 10px;
      color: #555;
    }
  </style>
</head>
<body>

<div class="topbar">CasFrontend [2.0.0] — IA Intégration</div>

<div class="container">
  <div class="sidebar">
    <div class="letter">D</div>
    <div class="op-info" id="opInfo">...</div>
  </div>

  <div class="content">
    <div class="breadcrumb">
      Lot : <span id="breadLot">—</span> &nbsp;›&nbsp; Grande pièce
    </div>

    <h2>Scanner la grande pièce</h2>
    <p class="subtitle">
      Scannez le QR code de la grande peau de cuir.
    </p>

    <div class="scan-box">
      <label>QR Code de la grande pièce</label>
      <input type="text" id="gpInput"
             placeholder="Ex: QR-GP-2026-001"
             onkeydown="if(event.key==='Enter') scanGP()">
      <button class="btn-primary" onclick="scanGP()" id="btnScan">
        🔍 Scanner / Valider
      </button>
    </div>

    <div class="gp-info" id="gpInfo">
      <h3>✅ Grande pièce reconnue</h3>
      <table>
        <tr><td>ID Grande pièce</td><td id="infoGPId">—</td></tr>
        <tr><td>Lot</td><td id="infoGPLot">—</td></tr>
        <tr><td>Statut</td><td id="infoGPStatut">—</td></tr>
        <tr><td>Pièces déjà inspectées</td><td id="infoGPNb">—</td></tr>
      </table>

      <div class="buttons" id="btnsAction" style="display:none">
        <button class="btn-inspect" onclick="lancerInspection()">
          📷 Lancer l'inspection
        </button>
        <button class="btn-fin" onclick="finGrandePiece()">
          ✅ Terminer cette pièce
        </button>
      </div>

      <button class="btn-lot" onclick="autreGP()">
        ↩ Scanner une autre grande pièce
      </button>
    </div>

    <div class="message" id="message"></div>
  </div>
</div>

<div class="status-bar" id="statusBar">
  Prêt — En attente du scan de la grande pièce...
</div>

<script>
  const API      = 'http://localhost:3000/api/hmi';
  const session  = JSON.parse(localStorage.getItem('session')    || '{}');
  const lot      = JSON.parse(localStorage.getItem('currentLot') || '{}');
  let   currentGP = null;

  // Vérifications
  if (!session.id_operateur) { window.location.href = 'index.html'; }
  if (!lot.id_lot)           { window.location.href = 'lot.html';   }

  // Afficher info
  document.getElementById('opInfo').innerHTML =
    `<strong>${session.prenom || ''}</strong><br>${session.client || ''}`;
  document.getElementById('breadLot').textContent = lot.id_lot;

  async function scanGP() {
    const qr_code = document.getElementById('gpInput').value.trim();
    if (!qr_code) return;

    const btn = document.getElementById('btnScan');
    btn.disabled    = true;
    btn.textContent = '⏳ Recherche...';

    try {
      const res = await fetch(`${API}/scan-grande-piece`, {
        method : 'POST',
        headers: { 'Content-Type': 'application/json' },
        body   : JSON.stringify({
          qr_code,
          id_lot     : lot.id_lot,
          id_session : session.id_session
        })
      });

      const data = await res.json();

      if (res.ok) {
        currentGP = data;
        localStorage.setItem('currentGP', JSON.stringify(data));

        document.getElementById('infoGPId').textContent     = data.id_grande_piece;
        document.getElementById('infoGPLot').textContent    = data.id_lot;
        document.getElementById('infoGPStatut').textContent = data.statut;
        document.getElementById('infoGPNb').textContent     = data.nb_pieces;

        document.getElementById('gpInfo').style.display      = 'block';
        document.getElementById('btnsAction').style.display  = 'flex';
        document.getElementById('message').className         = 'message';
        document.getElementById('statusBar').textContent     =
          `Grande pièce ${data.id_grande_piece} — Prête pour inspection`;

      } else {
        showError(data.message || 'Grande pièce introuvable');
      }

    } catch (err) {
      showError('Erreur connexion serveur');
    } finally {
      btn.disabled    = false;
      btn.textContent = '🔍 Scanner / Valider';
    }
  }

  function lancerInspection() {
    window.location.href = 'inspection.html';
  }

  async function finGrandePiece() {
    if (!currentGP) return;

    try {
      const res = await fetch(`${API}/fin-grande-piece`, {
        method : 'POST',
        headers: { 'Content-Type': 'application/json' },
        body   : JSON.stringify({
          id_grande_piece: currentGP.id_grande_piece
        })
      });

      const data = await res.json();

      if (res.ok) {
        alert(
          `Grande pièce terminée ✅\n` +
          `Total : ${data.total} pièces\n` +
          `IO    : ${data.io}\n` +
          `NIO   : ${data.nio}`
        );
        autreGP();
      }

    } catch (err) {
      showError('Erreur connexion serveur');
    }
  }

  function autreGP() {
    localStorage.removeItem('currentGP');
    document.getElementById('gpInput').value          = '';
    document.getElementById('gpInfo').style.display   = 'none';
    document.getElementById('btnsAction').style.display = 'none';
    document.getElementById('statusBar').textContent  =
      'Prêt — Scanner la prochaine grande pièce';
    currentGP = null;
  }

  function showError(msg) {
    const el = document.getElementById('message');
    el.textContent = msg;
    el.className   = 'message error';
    document.getElementById('statusBar').textContent = '❌ ' + msg;
  }
</script>

</body>
</html>
