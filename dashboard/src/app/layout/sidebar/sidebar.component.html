<aside class="sidebar" [class.collapsed]="isCollapsed">

  <div class="sidebar-header">
    <div class="brand-wrap">
      <div class="brand-icon">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <rect x="2" y="5" width="14" height="9" rx="2"
                stroke="#5be4a4" stroke-width="1.4" fill="none"/>
          <path d="M5 9L8 12L13 6" stroke="#5be4a4" stroke-width="1.6"
                fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="brand-text" *ngIf="!isCollapsed">
        <span class="brand-name">CuirQuality</span>
        <span class="brand-group">DRÄXLMAIER</span>
      </div>
    </div>
    
  </div>

  <nav class="sidebar-nav">
    <ng-container *ngFor="let group of menuGroups">
      <div class="nav-section" *ngIf="!isCollapsed">{{ group.label }}</div>
      <div class="nav-divider" *ngIf="isCollapsed"></div>
      <a *ngFor="let item of group.items"
         class="nav-item"
         [routerLink]="item.path"
         [class.active]="isActive(item.path)"
         [title]="isCollapsed ? item.label : ''">
        <span class="nav-icon-wrap"
              [class.active]="isActive(item.path)"
              [innerHTML]="item.svg">
        </span>
        <span class="nav-label" *ngIf="!isCollapsed">{{ item.label }}</span>
        <span class="active-dot"
              *ngIf="!isCollapsed && isActive(item.path)">
        </span>
      </a>
    </ng-container>
  </nav>

  <div class="sidebar-footer">
    <div class="user-row">
      <div class="user-avatar">{{ userInitials }}</div>
      <div class="user-details" *ngIf="!isCollapsed">
        <span class="user-name">
          {{ currentUser?.prenom }} {{ currentUser?.nom }}
        </span>
        <span class="user-role-badge">{{ userRoleLabel }}</span>
      </div>
    </div>
    <button class="logout-btn" (click)="logout()"
            [title]="isCollapsed ? 'Déconnexion' : ''">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      <span *ngIf="!isCollapsed">Déconnexion</span>
    </button>
  </div>

</aside>
